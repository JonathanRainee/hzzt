services:
  postgres:
    image: postgres:16
    container_name: hzzt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hzzt
      POSTGRES_PASSWORD: hzzt_dev_password
      POSTGRES_DB: hzzt_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hzzt -d hzzt_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16
    container_name: hzzt_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: hzzt
      POSTGRES_PASSWORD: hzzt_test_password
      POSTGRES_DB: hzzt_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hzzt -d hzzt_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  postgres_test_data:
