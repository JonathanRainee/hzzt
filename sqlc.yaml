version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: users.password_hash
            go_struct_tag: 'json:"-"'
          - column: user_preferences.app_lock_pin_hash
            go_struct_tag: 'json:"-"'
          - db_type: "pg_catalog.numeric"
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: github.com/shopspring/decimal.NullDecimal
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: github.com/google/uuid.NullUUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
