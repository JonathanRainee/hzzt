        type: string
    type: object
  users.patchRequest:
    properties:
      name:
        maxLength: 60
        minLength: 1
        type: string
      timezone:
        maxLength: 64
        type: string
    type: object
  users.verifyAppLockRequest:
    properties:
      pin:
        maxLength: 16
        type: string
    required:
    - pin
    type: object
  wallets.CardStyle:
    properties:
      color:
        example: '#4480EE'
        type: string
      colors:
        items:
          type: string
        type: array
      direction:
        enum:
        - "N"
        - NE
        - E
        - SE
        - S
        - SW
        - W
        - NW
        type: string
      mode:
        enum:
        - SOLID
        - GRADIENT
        - TEMPLATE
        type: string
      presetId:
        type: string
      templateId:
        type: string
    type: object
  wallets.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/wallets.WalletDTO'
        type: array
      total:
        $ref: '#/definitions/currency.AggregateResult'
    type: object
  wallets.Preset:
    properties:
      colors:
        items:
          type: string
        type: array
      direction:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  wallets.Template:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  wallets.WalletDTO:
    properties:
      balance:
        example: "134.26"
        type: string
      cardStyle:
        $ref: '#/definitions/wallets.CardStyle'
      createdAt:
        type: string
      currency:
        example: IDR
        type: string
      icon:
        type: string
      id:
        type: string
      isFavorite:
        type: boolean
      name:
        type: string
      sortOrder:
        type: integer
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
  wallets.createRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      initialBalance:
        example: "134.26"
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    required:
    - icon
    - name
    - type
    type: object
  wallets.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
    required:
    - ids
    type: object
  wallets.setBalanceRequest:
    properties:
      newBalance:
        example: "100"
        type: string
      note:
        maxLength: 500
        type: string
    required:
    - newBalance
    type: object
  wallets.updateRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
info:
  contact: {}
  description: Asset management backend API.
  title: Hzzt API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password (revokes all other sessions)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always responds 200, whether or not the email is registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Request a password reset email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Log in with email and password
      tags:
