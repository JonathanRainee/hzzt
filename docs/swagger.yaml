basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: seconds
        example: 900
        type: integer
      user:
        $ref: '#/definitions/auth.UserDTO'
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.UserDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      lastActiveSpaceId:
        type: string
      name:
        type: string
      timezone:
        type: string
    type: object
  auth.changePasswordRequest:
    properties:
      currentPassword:
        maxLength: 128
        type: string
      newPassword:
        maxLength: 128
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  auth.forgotPasswordRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.loginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  auth.registerRequest:
    properties:
      email:
        example: jane@example.com
        maxLength: 254
        type: string
      name:
        example: Jane
        maxLength: 60
        minLength: 1
        type: string
      password:
        example: correct horse battery
        maxLength: 128
        type: string
      timezone:
        example: Asia/Jakarta
        maxLength: 64
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.resetPasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        type: string
      token:
        maxLength: 256
        type: string
    required:
    - newPassword
    - token
    type: object
  categories.CategoryDTO:
    properties:
      budgetAmount:
        example: "500000"
        type: string
      budgetCurrency:
        description: the space's base currency when a budget is set
        example: IDR
        type: string
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      sortOrder:
        type: integer
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  categories.createRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - color
    - icon
    - name
    - type
    type: object
  categories.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - ids
    - type
    type: object
  categories.updateRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  currency.AggregateResult:
    properties:
      breakdown:
        items:
          $ref: '#/definitions/currency.BreakdownEntry'
        type: array
      currency:
        type: string
      total:
        type: number
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  currency.BreakdownEntry:
    properties:
      converted:
        type: number
      currency:
        type: string
      original:
        type: number
    type: object
  currency.Currency:
    properties:
      code:
        type: string
      minorUnits:
        type: integer
      name:
        type: string
      symbol:
        type: string
    type: object
  currency.LatestResponse:
    properties:
      asOf:
        example: "2026-11-18"
        type: string
      base:
        example: IDR
        type: string
      rates:
        additionalProperties:
          type: string
        type: object
      source:
        example: freecurrencyapi
        type: string
    type: object
  currency.ManualRateDTO:
    properties:
      base:
        example: USD
        type: string
      quote:
        example: IDR
        type: string
      rate:
        example: "16000"
        type: string
      updatedAt:
        type: string
    type: object
  currency.Warning:
    properties:
      code:
        type: string
      label:
        type: string
      message:
        type: string
    type: object
  currency.putManualRequest:
    properties:
      rate:
        example: "16000"
        type: string
    required:
    - rate
    type: object
  httpx.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorBody'
      requestId:
        type: string
    type: object
  server.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  spaces.ActiveInvitationResponse:
    properties:
      invitation:
        $ref: '#/definitions/spaces.InvitationDTO'
    type: object
  spaces.InvitationDTO:
    properties:
      code:
        type: string
      expiresAt:
        type: string
      link:
        type: string
    type: object
  spaces.MemberDTO:
    properties:
      email:
        type: string
      joinedAt:
        type: string
      name:
        type: string
      role:
        type: string
      userId:
        type: string
    type: object
  spaces.SpaceDTO:
    properties:
      autoFxConversion:
        type: boolean
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      budgetPeriodStartDay:
        type: integer
      createdAt:
        type: string
      id:
        type: string
      memberCount:
        type: integer
      name:
        type: string
      role:
        type: string
      trackingMode:
        type: string
    type: object
  spaces.createRequest:
    properties:
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      name:
        maxLength: 40
        minLength: 1
        type: string
    required:
    - name
    type: object
  spaces.updateRequest:
    properties:
      autoFxConversion:
        type: boolean
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      name:
        maxLength: 40
        minLength: 1
        type: string
      trackingMode:
        enum:
        - FULL_NET_WORTH
        - CASH_ONLY
        type: string
    type: object
  users.PreferencesDTO:
    properties:
      appLockEnabled:
        type: boolean
      hideAmounts:
        type: boolean
      keyboardType:
        enum:
        - MINI_CALCULATOR
        - STANDARD_NUMERIC
        type: string
    type: object
  users.VerifyResponse:
    properties:
      valid:
        type: boolean
    type: object
  users.changePINRequest:
    properties:
      currentPin:
        maxLength: 16
        type: string
      newPin:
        maxLength: 16
        type: string
    required:
    - currentPin
    - newPin
    type: object
  users.deleteRequest:
    properties:
      password:
        maxLength: 128
        type: string
    required:
    - password
    type: object
  users.disableAppLockRequest:
    properties:
      password:
        maxLength: 128
        type: string
    required:
    - password
    type: object
  users.enableAppLockRequest:
    properties:
      password:
        maxLength: 128
        type: string
      pin:
        maxLength: 16
        type: string
    required:
    - password
    - pin
    type: object
  users.patchPreferencesRequest:
    properties:
      hideAmounts:
        type: boolean
      keyboardType:
        enum:
        - MINI_CALCULATOR
        - STANDARD_NUMERIC
        type: string
    type: object
  users.patchRequest:
    properties:
      name:
        maxLength: 60
        minLength: 1
        type: string
      timezone:
        maxLength: 64
        type: string
    type: object
  users.verifyAppLockRequest:
    properties:
      pin:
        maxLength: 16
        type: string
    required:
    - pin
    type: object
  wallets.CardStyle:
    properties:
      color:
        example: '#4480EE'
        type: string
      colors:
        items:
          type: string
        type: array
      direction:
        enum:
        - "N"
        - NE
        - E
        - SE
        - S
        - SW
        - W
        - NW
        type: string
      mode:
        enum:
        - SOLID
        - GRADIENT
        - TEMPLATE
        type: string
      presetId:
        type: string
      templateId:
        type: string
    type: object
  wallets.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/wallets.WalletDTO'
        type: array
      total:
        $ref: '#/definitions/currency.AggregateResult'
    type: object
  wallets.Preset:
    properties:
      colors:
        items:
          type: string
        type: array
      direction:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  wallets.Template:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  wallets.WalletDTO:
    properties:
      balance:
        example: "134.26"
        type: string
      cardStyle:
        $ref: '#/definitions/wallets.CardStyle'
      createdAt:
        type: string
      currency:
        example: IDR
        type: string
      icon:
        type: string
      id:
        type: string
      isFavorite:
        type: boolean
      name:
        type: string
      sortOrder:
        type: integer
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
  wallets.createRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      initialBalance:
        example: "134.26"
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    required:
    - icon
    - name
    - type
    type: object
  wallets.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
    required:
    - ids
    type: object
  wallets.setBalanceRequest:
    properties:
      newBalance:
        example: "100"
        type: string
      note:
        maxLength: 500
        type: string
    required:
    - newBalance
    type: object
  wallets.updateRequest:
    properties:
      cardStyle:
        type: object
      currency:
        maxLength: 8
        type: string
      icon:
        maxLength: 64
        type: string
      isFavorite:
        type: boolean
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - BANK
        - E_WALLET
        - CASH
        - OTHER
        type: string
    type: object
info:
  contact: {}
  description: Asset management backend API.
  title: Hzzt API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change password (revokes all other sessions)
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always responds 200, whether or not the email is registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Request a password reset email
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Log in with email and password
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
      summary: Revoke the current refresh token family and clear the cookie
      tags:
      - auth
  /auth/logout-all:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Revoke all of the user's refresh tokens
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Reads the httpOnly `rt` cookie. Presenting an already-rotated token
        revokes the whole token family (REFRESH_TOKEN_REUSED).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "401":
          description: REFRESH_TOKEN_INVALID / REFRESH_TOKEN_REUSED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Rotate the refresh token and get a new access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: EMAIL_ALREADY_REGISTERED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Register an account
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.resetPasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: RESET_TOKEN_INVALID
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Reset password with an emailed token (revokes all sessions)
      tags:
      - auth
  /categories/suggestions:
    get:
      parameters:
      - description: EXPENSE or INCOME
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Suggested category names
      tags:
      - categories
  /currencies:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/currency.Currency'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List supported currencies
      tags:
      - currency
  /fx/latest:
    get:
      description: rates[Q] is how many Q one unit of `base` buys. `asOf` is null
        and `rates` empty until the first provider refresh has completed.
      parameters:
      - description: Base currency (default USD)
        in: query
        name: base
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/currency.LatestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Latest FX rates re-based to a currency
      tags:
      - currency
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
      summary: Liveness check
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.StatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Readiness check (database)
      tags:
      - health
  /invitations/{code}/accept:
    post:
      parameters:
      - description: Invitation code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/spaces.SpaceDTO'
        "409":
          description: ALREADY_A_MEMBER
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVITATION_INVALID / INVITATION_EXPIRED / SPACE_MEMBER_LIMIT
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Join a space with an invitation code (as MEMBER)
      tags:
      - spaces
  /me:
    delete:
      consumes:
      - application/json
      description: Blocked with OWNERSHIP_TRANSFER_REQUIRED while I own a space that
        has other members.
      parameters:
      - description: Password confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.deleteRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: OWNERSHIP_TRANSFER_REQUIRED / INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete my account
      tags:
      - me
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get my profile (includes lastActiveSpaceId)
      tags:
      - me
    patch:
      consumes:
      - application/json
      parameters:
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.patchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update my name and/or timezone
      tags:
      - me
  /me/app-lock:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.disableAppLockRequest'
      responses:
        "204":
          description: No Content
        "422":
          description: INVALID_CURRENT_PASSWORD / APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Disable the app lock (requires the account password)
      tags:
      - me
    post:
      consumes:
      - application/json
      description: 'The app lock is a client-side UX gate that syncs across devices,
        NOT a security boundary: API access is governed by the JWT alone.'
      parameters:
      - description: PIN (4 to 6 digits) and account password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.enableAppLockRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "409":
          description: APP_LOCK_ALREADY_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_CURRENT_PASSWORD
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Enable the app lock
      tags:
      - me
  /me/app-lock/pin:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Current and new PIN
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.changePINRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "422":
          description: INVALID_PIN / APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: APP_LOCK_TEMPORARILY_LOCKED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change the app-lock PIN (a wrong current PIN counts toward the lockout)
      tags:
      - me
  /me/app-lock/verify:
    post:
      consumes:
      - application/json
      description: 5 consecutive wrong PINs lock verification for 5 minutes (429 APP_LOCK_TEMPORARILY_LOCKED
