          schema:
            $ref: '#/definitions/users.VerifyResponse'
        "422":
          description: APP_LOCK_NOT_ENABLED
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "429":
          description: APP_LOCK_TEMPORARILY_LOCKED / RATE_LIMITED
