basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        description: seconds
        example: 900
        type: integer
      user:
        $ref: '#/definitions/auth.UserDTO'
    type: object
  auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  auth.UserDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      lastActiveSpaceId:
        type: string
      name:
        type: string
      timezone:
        type: string
    type: object
  auth.changePasswordRequest:
    properties:
      currentPassword:
        maxLength: 128
        type: string
      newPassword:
        maxLength: 128
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  auth.forgotPasswordRequest:
    properties:
      email:
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.loginRequest:
    properties:
      email:
        maxLength: 254
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  auth.registerRequest:
    properties:
      email:
        example: jane@example.com
        maxLength: 254
        type: string
      name:
        example: Jane
        maxLength: 60
        minLength: 1
        type: string
      password:
        example: correct horse battery
        maxLength: 128
        type: string
      timezone:
        example: Asia/Jakarta
        maxLength: 64
        type: string
    required:
    - email
    - name
    - password
    type: object
  auth.resetPasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        type: string
      token:
        maxLength: 256
        type: string
    required:
    - newPassword
    - token
    type: object
  categories.CategoryDTO:
    properties:
      budgetAmount:
        example: "500000"
        type: string
      budgetCurrency:
        description: the space's base currency when a budget is set
        example: IDR
        type: string
      color:
        type: string
      createdAt:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      sortOrder:
        type: integer
      stats:
        allOf:
        - $ref: '#/definitions/categories.StatsDTO'
        description: only with includeStats=true
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  categories.StatsDTO:
    properties:
      budgetRemaining:
        type: string
      budgetUsedPct:
        type: string
      currency:
        example: IDR
        type: string
      received:
        type: string
      spent:
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  categories.createRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - color
    - icon
    - name
    - type
    type: object
  categories.reorderRequest:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        type: array
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    required:
    - ids
    - type
    type: object
  categories.updateRequest:
    properties:
      budgetAmount:
        type: string
      color:
        maxLength: 16
        type: string
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      type:
        enum:
        - EXPENSE
        - INCOME
        type: string
    type: object
  currency.AggregateResult:
    properties:
      breakdown:
        items:
          $ref: '#/definitions/currency.BreakdownEntry'
        type: array
      currency:
        type: string
      total:
        type: number
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  currency.BreakdownEntry:
    properties:
      converted:
        type: number
      currency:
        type: string
      original:
        type: number
    type: object
  currency.Currency:
    properties:
      code:
        type: string
      minorUnits:
        type: integer
      name:
        type: string
      symbol:
        type: string
    type: object
  currency.LatestResponse:
    properties:
      asOf:
        example: "2026-11-18"
        type: string
      base:
        example: IDR
        type: string
      rates:
        additionalProperties:
          type: string
        type: object
      source:
        example: freecurrencyapi
        type: string
    type: object
  currency.ManualRateDTO:
    properties:
      base:
        example: USD
        type: string
      quote:
        example: IDR
        type: string
      rate:
        example: "16000"
        type: string
      updatedAt:
        type: string
    type: object
  currency.Warning:
    properties:
      code:
        type: string
      label:
        type: string
      message:
        type: string
    type: object
  currency.putManualRequest:
    properties:
      rate:
        example: "16000"
        type: string
    required:
    - rate
    type: object
  httpx.ErrorBody:
    properties:
      code:
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorBody'
      requestId:
        type: string
    type: object
  investments.BaseValues:
    properties:
      costBasis:
        type: string
      currency:
        example: IDR
        type: string
      fxRate:
        description: 'FxRate is the rate used: base-currency units per 1 quote-currency
          unit.'
        example: "16000"
        type: string
      marketValue:
        type: string
      unrealizedPl:
        type: string
    type: object
  investments.CreateRequestDoc:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      avgBuyPrice:
        example: "9200"
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        example: "5.5"
        type: string
      fees:
        type: string
      icon:
        type: string
      manualCurrentValue:
        type: string
      manualFxRate:
        example: "16000"
        type: string
      manualPrice:
        example: "9500"
        type: string
      name:
        example: Bank Central Asia
        type: string
      priceMode:
        type: string
      purchaseDate:
        example: "2026-01-31"
        type: string
      quantity:
        example: "0.5"
        type: string
      quoteCurrency:
        type: string
      symbol:
        type: string
    type: object
  investments.FieldMeta:
    properties:
      kind:
        enum:
        - TEXT
        - INTEGER
        - DECIMAL
        - DATE
        - ENUM
        type: string
      label:
        example: Staked quantity
        type: string
      name:
        example: stakedQuantity
        type: string
      options:
        items:
          type: string
        type: array
      required:
        type: boolean
    type: object
  investments.InvestmentDTO:
    properties:
      assetType:
        enum:
        - CRYPTO
        - ID_STOCK
        - US_STOCK
        - MUTUAL_FUND
        - GLOBAL_ETF
        type: string
      avgBuyPrice:
        type: string
      createdAt:
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        type: string
      fees:
        type: string
      icon:
        type: string
      id:
        type: string
      instrumentId:
        type: string
      isShared:
        type: boolean
      manualCurrentValue:
        type: string
      manualFxRate:
        type: string
      manualPrice:
        type: string
      name:
        type: string
      priceMode:
        enum:
        - AUTO
        - MANUAL
        type: string
      purchaseDate:
        example: "2026-01-31"
        type: string
      quantity:
        example: "200"
        type: string
      quoteCurrency:
        example: IDR
        type: string
      symbol:
        type: string
      updatedAt:
        type: string
      valuation:
        $ref: '#/definitions/investments.Valuation'
    type: object
  investments.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/investments.InvestmentDTO'
        type: array
      summary:
        $ref: '#/definitions/investments.Summary'
    type: object
  investments.PatchInput:
    properties:
      assetType:
        type: string
      avgBuyPrice:
        type: string
      details:
        type: object
      estimatedAnnualChangePct:
        type: string
      fees:
        type: string
      icon:
        maxLength: 64
        type: string
      manualCurrentValue:
        type: string
      manualFxRate:
        type: string
      manualPrice:
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      priceMode:
        enum:
        - AUTO
        - MANUAL
        type: string
      purchaseDate:
        type: string
      quantity:
        type: string
      quoteCurrency:
        maxLength: 8
        type: string
      symbol:
        type: string
    type: object
  investments.Summary:
    properties:
      currency:
        example: IDR
        type: string
      totalCost:
        type: string
      totalValue:
        type: string
      unrealizedPl:
        type: string
      unrealizedPlPct:
        description: UnrealizedPLPct is a percentage; null when the total cost is
          0.
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  investments.TypeDefaults:
    properties:
      estimatedAnnualChangePct:
        type: string
      fees:
        type: string
      priceMode:
        type: string
    type: object
  investments.TypeMeta:
    properties:
      assetType:
        type: string
      defaultIcon:
        type: string
      defaults:
        $ref: '#/definitions/investments.TypeDefaults'
      detailFields:
        description: DetailFields are the fields of the `details` object.
        items:
          $ref: '#/definitions/investments.FieldMeta'
        type: array
      label:
        type: string
      lotSize:
        type: integer
      quantityMode:
        enum:
        - QUANTITY
        - LOTS
        type: string
      quoteCurrency:
        description: 'null: chosen by the client (default: the space base currency)'
        type: string
      quoteCurrencyEditable:
        type: boolean
      supportsAutoPrice:
        type: boolean
      symbolRequired:
        type: boolean
    type: object
  investments.Valuation:
    properties:
      base:
        allOf:
        - $ref: '#/definitions/investments.BaseValues'
        description: Base holds the converted figures; null when no FX rate is available
          (see Warnings).
      costBasis:
        type: string
      isStale:
        type: boolean
      marketValue:
        description: Native figures, in the investment's quote currency.
        type: string
      price:
        type: string
      priceAsOf:
        type: string
      priceSource:
        enum:
        - MARKET
        - MANUAL
        - MANUAL_VALUE
        type: string
      unrealizedPl:
        type: string
      unrealizedPlPct:
        description: UnrealizedPLPct is a percentage (12.5 means +12.5%); null when
          the cost basis is 0.
        type: string
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  server.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  spaces.ActiveInvitationResponse:
    properties:
      invitation:
        $ref: '#/definitions/spaces.InvitationDTO'
    type: object
  spaces.InvitationDTO:
    properties:
      code:
        type: string
      expiresAt:
        type: string
      link:
        type: string
    type: object
  spaces.MemberDTO:
    properties:
      email:
        type: string
      joinedAt:
        type: string
      name:
        type: string
      role:
        type: string
      userId:
        type: string
    type: object
  spaces.SpaceDTO:
    properties:
      autoFxConversion:
        type: boolean
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      budgetPeriodStartDay:
        type: integer
      createdAt:
        type: string
      id:
        type: string
      memberCount:
        type: integer
      name:
        type: string
      role:
        type: string
      trackingMode:
        type: string
    type: object
  spaces.createRequest:
    properties:
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      name:
        maxLength: 40
        minLength: 1
        type: string
    required:
    - name
    type: object
  spaces.updateRequest:
    properties:
      autoFxConversion:
        type: boolean
      avatarColor:
        type: string
      avatarEmoji:
        type: string
      baseCurrency:
        type: string
      name:
        maxLength: 40
        minLength: 1
        type: string
      trackingMode:
        enum:
        - FULL_NET_WORTH
        - CASH_ONLY
        type: string
    type: object
  transactions.DailySummaryResponse:
    properties:
      currency:
        example: IDR
        type: string
      items:
        items:
          $ref: '#/definitions/transactions.DaySummaryDTO'
        type: array
      warnings:
        items:
          $ref: '#/definitions/currency.Warning'
        type: array
    type: object
  transactions.DaySummaryDTO:
    properties:
      count:
        type: integer
      date:
        example: "2026-11-18"
        type: string
      expense:
        type: string
      income:
        type: string
      transfer:
        type: string
    type: object
  transactions.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/transactions.TransactionDTO'
        type: array
      nextCursor:
        type: string
    type: object
  transactions.Ref:
    properties:
      color:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  transactions.TransactionDTO:
    properties:
      amount:
        example: "50000"
        type: string
      category:
        $ref: '#/definitions/transactions.Ref'
      createdAt:
        type: string
      createdById:
        type: string
      currency:
        example: IDR
        type: string
      direction:
        enum:
        - IN
        - OUT
        type: string
      fxRate:
        type: string
      id:
        type: string
      note:
        type: string
      occurredAt:
        type: string
      title:
        type: string
      toAmount:
        type: string
      toCurrency:
        type: string
      toWallet:
        $ref: '#/definitions/transactions.Ref'
      type:
        enum:
        - INCOME
        - EXPENSE
        - TRANSFER
        - ADJUSTMENT
        - OPENING_BALANCE
        type: string
      updatedAt:
        type: string
      wallet:
        $ref: '#/definitions/transactions.Ref'
    type: object
  transactions.createRequest:
    properties:
      amount:
        example: "50000"
        type: string
      categoryId:
        type: string
      note:
        maxLength: 1000
        type: string
      occurredAt:
        type: string
      title:
        maxLength: 200
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        type: string
      walletId:
        type: string
    required:
    - amount
    - type
    - walletId
    type: object
  transactions.topUpRequest:
    properties:
      amount:
        example: "100000"
        type: string
      note:
        maxLength: 1000
        type: string
    required:
    - amount
    type: object
  transactions.updateRequest:
    properties:
      amount:
        type: string
      categoryId:
        type: string
      note:
        type: string
      occurredAt:
        type: string
      title:
        type: string
      type:
        enum:
        - INCOME
        - EXPENSE
        type: string
      walletId:
        type: string
    type: object
  transfers.createRequest:
    properties:
      amount:
        example: "100.00"
        type: string
      from:
        type: object
      note:
        maxLength: 1000
        type: string
      occurredAt:
        type: string
      to:
        type: object
      toAmount:
        example: "1600000"
        type: string
    required:
    - amount
    type: object
  transfers.updateRequest:
    properties:
      amount:
        type: string
      from:
        type: object
      note:
        type: string
      occurredAt:
        type: string
      to:
        type: object
      toAmount:
        type: string
    type: object
  users.PreferencesDTO:
    properties:
      appLockEnabled:
        type: boolean
      hideAmounts:
        type: boolean
      keyboardType:
        enum:
        - MINI_CALCULATOR
        - STANDARD_NUMERIC
        type: string
    type: object
  users.VerifyResponse:
    properties:
      valid:
        type: boolean
    type: object
  users.changePINRequest:
    properties:
      currentPin:
        maxLength: 16
        type: string
      newPin:
        maxLength: 16
        type: string
    required:
    - currentPin
    - newPin
    type: object
  users.deleteRequest:
    properties:
      password:
        maxLength: 128
        type: string
    required:
    - password
    type: object
  users.disableAppLockRequest:
    properties:
      password:
        maxLength: 128
        type: string
    required:
    - password
    type: object
  users.enableAppLockRequest:
    properties:
      password:
        maxLength: 128
        type: string
      pin:
        maxLength: 16
        type: string
    required:
    - password
    - pin
