        items:
          type: string
        name: types
        type: array
      - collectionFormat: csv
        description: Category IDs
        in: query
        items:
          type: string
        name: categoryIds
        type: array
      - collectionFormat: csv
        description: Wallet IDs
        in: query
        items:
          type: string
        name: walletIds
        type: array
      - description: Search text
        in: query
        name: q
        type: string
      - description: Page size (default 30, max 100)
        in: query
        name: limit
        type: integer
      - description: nextCursor of the previous page
        in: query
        name: cursor
        type: string
